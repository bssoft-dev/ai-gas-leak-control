# OutputIndexBuilder 모듈 설정
# - scan_pattern: 출력 양식 탐색 시 스캔할 파일 패턴 (기본 **/*.md)
# - max_files_for_scan: LLM에 넘길 파일 수 상한 (제목/목차만 추출)
# - find_format_prompt: 기존 파일에서 출력 양식 찾기용 LLM 프롬프트
# - extract_toc_prompt: 현재 폴더 파일들(경로+헤딩)에서 목차 추출용 LLM 프롬프트 (NONE 시에만 시도)
# - create_index_prompt: analysis_result 기준 목차 생성용 LLM 프롬프트

scan_pattern: "**/*.md"
max_files_for_scan: 80
context_length_limit: 12000

find_format_prompt: |
  다음은 보관소 내 마크다운 파일들의 경로와 제목(헤딩) 목록입니다.
  이 중에서 "최종 출력 보고서"나 "리포트", "결과 요약" 등에 쓸 수 있는 양식(목차/챕터 구조)이 있으면,
  그 목차만 마크다운으로 추출해 주세요. ## 챕터명 형식으로 한 줄에 하나씩 작성합니다.
  적합한 양식이 하나도 없으면 첫 줄에 반드시 NONE 만 출력하고 끝내세요.
  양식이 있으면 NONE을 출력하지 말고, 목차 마크다운만 출력하세요.

extract_toc_prompt: |
  다음은 현재 폴더(보관소) 내 마크다운 파일들의 경로와 헤딩 목록입니다.
  이 파일들을 하나의 출력 보고서로 통합할 때 쓸 수 있는 목차(테이블 오브 컨텐츠)를 ## 챕터명 형식으로 추출해 주세요.
  - 논리적 순서로 5~15개 내외의 챕터로 구성하세요.
  - 제목만 나열하고 본문은 작성하지 마세요.
  불가능하거나 적합한 목차를 만들 수 없으면 첫 줄에 NONE만 출력하세요.

create_index_prompt: |
  다음 [analysis_result] 내용을 기준으로, 최종 출력 보고서용 목차(테이블 오브 컨텐츠)를 마크다운으로 작성하세요.
  - ## 챕터명 형식으로 한 줄에 하나씩 작성합니다.
  - 분석 결과의 논리적 흐름에 맞게 5~15개 내외의 챕터로 구성하세요.
  - 제목만 나열하고 본문은 작성하지 마세요.
