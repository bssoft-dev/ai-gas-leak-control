# OutputReportBuilder 모듈 설정
# - chapter_prompt: 챕터별 본문 생성용 LLM 프롬프트
# - min_chars, max_chars: 챕터당 글자 수 (500~3000)
# - context_length_limit: LLM 컨텍스트 합산 제한
# - 컨텍스트 소스별 길이 제한은 todo_planner/config.yaml의 context_content_limits 사용

min_chars: 500
max_chars: 30000
context_length_limit: 180000

chapter_prompt: |
  다음 컨텍스트를 바탕으로, 출력 보고서의 "[챕터명]" 챕터에 해당하는 본문을 작성하세요.
  - 500자 이상 30000자 이하로 한글로 작성하세요.
  - 마크다운 형식(소제목, 목록 등)을 사용해도 됩니다.
  - [output_index], [analysis_result], [사용자 관심사], [todo_result], [이전 보고서 초안]을 반영하세요.
  - 해당 챕터에만 집중하고, 다른 챕터 내용을 포함하지 마세요.
