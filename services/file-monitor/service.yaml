# SagoHub Service: File Monitor (Event-Driven v2.0)

service:
  id: "com.SagoHub.file-monitor"
  version: "2.0.0"
  name: "File Monitor"
  description: "폴더를 모니터링하여 파일 변경 사항을 콘솔에 출력합니다."
  author: "SagoHub Team"
  icon: "icon.png"
  category: "utility"
  
  # UI 서버 설정
  ui_server:
    host: "0.0.0.0"
    port: 8080
    external_port: 26011

interface:
  - type: "react-ui" # 렌더링 타겟 (react, svelte, cli 등)
    id: "main_dashboard"
    label: "File Monitor Dashboard"
    description: "폴더를 모니터링하여 파일 변경 사항을 콘솔에 출력합니다."
    binding: "./services/file-monitor/frontend" # 프론트엔드에 미리 구현된 소스코드 경로를 바인딩
    
    # [핵심 1] 동적 바인딩: config 값을 props로 주입
    props:
      target_folder: "${config.target_folder}"
      watch_pattern: "${config.watch_pattern}"
      show_content: "${config.show_content}"
      is_logging: "${config.log_to_file}"

    # [핵심 2] 이벤트 매핑: UI가 시스템과 소통하는 인터페이스
    events:
      # UI에서 "설정 저장" 버튼을 누르면 이 이벤트가 나간다
      onSave: "PATH_SET"
      # UI가 이 이벤트를 수신하면 화면을 갱신한다 (Log Viewer 등)
      subscribe: ["E_FileCreated", "fs.read.success"]
  
config:
  target_folder:
    type: "path"
    label: "감시할 폴더"
    default: "./obsidian"
    required: true
  
  watch_pattern:
    type: "string"
    label: "파일 패턴 (Glob)"
    default: "**/*"
    description: "감시할 파일 패턴 (예: **/*.md, **/*.txt)"
  
  show_content:
    type: "boolean"
    label: "파일 내용 출력"
    description: "파일 내용을 콘솔에 출력합니까?"
    default: true
  
  log_to_file:
    type: "boolean"
    label: "로그 파일 저장"
    description: "변경 사항을 로그 파일에 저장합니까?"
    default: true

# -----------------------------------------------------------
# Pipeline 2.0: Event Mesh Definition
# 구조: Trigger -> Broadcast(Modules) -> Aggregation(충돌 해결)
# - Trigger: 파이프라인을 시작하는 이벤트
# - Broadcast: 트리거 이벤트를 여러 모듈에게 동시에 전달 (병렬 처리)
# - Aggregation: 여러 모듈이 각각 응답 이벤트를 발행할 때, 그 이벤트들 간의 충돌을 해결하는 전략
#
# [요청 파이프라인] 파일 내용 변경 시:
#   1) 파일 내용 불러와서 콘솔에 표시 (MonitorConsole)
#   2) LLM으로 요약 (LLMDrafterModule)
#   3) 요약 결과 콘솔에 표시 (E_DraftReady → MonitorConsole, payload 연동)
# -----------------------------------------------------------
pipelines: 
  # UI에서 경로(path) 설정 이벤트가 발생하면 file_watcher 모듈에 이벤트를 전달
  - id: "flow_file_watcher"
    name: "File Watcher"
    
    trigger:
      event: "PATH_SET"
      filter: "${config.target_folder}"
      debounce: 1000
      aggregation:
        strategy: "INDEPENDENT"
      
    broadcast:
      - module: "file_watcher.FileWatcherModule"
        id: "action_file_watcher"
        args:
          path: "${event.path}"

  # [파일 내용 변경] E_FileCreated: 파일 내용 콘솔 표시 + LLM 요약 생성
  # FileWatcher가 이미 path/content를 담아 발행하므로, 콘솔 표시와 LLM 동시 수행
  - id: "flow_file_content_and_summary"
    name: "File content → Console + LLM Summary"
    
    trigger:
      event: "E_FileCreated"
      filter: "${config.target_folder}/${config.watch_pattern}"
      debounce: 1000
      aggregation:
        strategy: "INDEPENDENT"
        target: null

    broadcast:
      # 1) 파일 내용을 콘솔에 표시
      - module: "monitor.MonitorConsoleModule"
        id: "action_console_content"
        args:
          message: "📄 파일 내용 (변경 감지)"
          path: "${event.path}"
          filename: "${event.filename}"
          content: "${event.content}"
          show_content: "${config.show_content}"
      
      # 2) LLM으로 요약(초안) 생성 → E_DraftReady 발행
      - module: "llm_drafter.LLMDrafterModule"
        id: "action_llm_summary"
        args:
          path: "${event.path}"
          content: "${event.content}"
      
      # 로그 저장 (선택)
      - module: "monitor.MonitorLogModule"
        id: "action_log"
        condition: "${config.log_to_file} == true"
        args:
          event_type: "created"
          path: "${event.path}"
          filename: "${event.filename}"
          content: "${event.content}"
          log_to_file: "${config.log_to_file}"

  # [요약 결과 콘솔 표시] LLMDrafter가 발행한 E_DraftReady → 콘솔에 요약 내용 전달
  # payload에 draft_body를 content로 넘겨 콘솔 모듈이 표시할 수 있도록 연동
  - id: "flow_summary_to_console"
    name: "LLM Summary → Console"
    
    trigger:
      event: "E_DraftReady"
      debounce: 500
      aggregation:
        strategy: "INDEPENDENT"
        target: null

    broadcast:
      - module: "monitor.MonitorConsoleModule"
        id: "action_console_summary"
        args:
          message: "📋 LLM 요약/초안"
          path: "${event.source_path}"
          content: "${event.draft_body}"
          show_content: true
